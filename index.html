
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de Fisioterapia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FisioGestão</h1>
        <p>Sistema de Gestão para Clínica de Fisioterapia</p>
    </header>

    <div class="container">

        <aside class="sidebar">
            <h2>Menu</h2>
            <a href="index.html">Dashboard</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="fisioterapeutas.html">Fisioterapeutas</a>
            <a href="agendamentos.html">Agendamentos</a>
            <a href="atendimentos.html">Atendimentos</a>
        </aside>

        <main>
            <h2>Painel Principal</h2>
            <p>Bem-vindo ao sistema de gestão da clínica!</p>

            <br>

            <div class="cards">

                <div class="card">
                    <h3>Pacientes</h3>
                    <p id="totalPacientes">0</p>
                </div>

                <div class="card">
                    <h3>Fisioterapeutas</h3>
                    <p id="totalFisioterapeutas">0</p>
                </div>

                <div class="card">
                    <h3>Agendamentos</h3>
                    <p id="totalAgendamentos">0</p>
                </div>

                <div class="card">
                    <h3>Atendimentos</h3>
                    <p id="totalAtendimentos">0</p>
                </div>

            </div>
        </main>

    </div>

    <script>
        function atualizarDashboard() {
            const pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];
            const fisioterapeutas = JSON.parse(localStorage.getItem("fisioterapeutas")) || [];
            const agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];
            const atendimentos = JSON.parse(localStorage.getItem("atendimentos")) || [];

            document.getElementById("totalPacientes").textContent = pacientes.length;
            document.getElementById("totalFisioterapeutas").textContent = fisioterapeutas.length;
            document.getElementById("totalAgendamentos").textContent = agendamentos.length;
            document.getElementById("totalAtendimentos").textContent = atendimentos.length;
        }

        atualizarDashboard();
    </script>

</body>
</html>

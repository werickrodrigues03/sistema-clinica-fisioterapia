
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes - FisioGestão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>FisioGestão</h1>
    <p>Gerenciamento de pacientes</p>
</header>

<div class="container">

    <aside class="sidebar">
        <h2>Menu</h2>
        <a href="index.html">Dashboard</a>
        <a href="pacientes.html">Pacientes</a>
        <a href="#">Fisioterapeutas</a>
        <a href="#">Agendamentos</a>
        <a href="#">Atendimentos</a>
    </aside>

    <main>
        <h2>Cadastro de Pacientes</h2>
        <p>Preencha os dados para cadastrar um paciente.</p>

        <form id="formPaciente">

            <label>Nome completo:</label>
            <input type="text" id="nome"
                placeholder="Nome do paciente" required>

            <label>Telefone:</label>
            <input type="tel" id="telefone"
                placeholder="(00) 00000-0000" required>

            <label>E-mail:</label>
            <input type="email" id="email"
                placeholder="email@exemplo.com">

            <label>Data de nascimento:</label>
            <input type="date" id="nascimento" required>

            <button type="submit" id="botaoSalvar">
                Cadastrar paciente
            </button>

            <button type="button" id="botaoCancelar" hidden>
                Cancelar edição
            </button>

        </form>

        <h2>Pacientes cadastrados</h2>

        <div id="listaPacientes"></div>

    </main>
</div>

<script>
const formulario = document.getElementById("formPaciente");
const lista = document.getElementById("listaPacientes");
const botaoSalvar = document.getElementById("botaoSalvar");
const botaoCancelar = document.getElementById("botaoCancelar");

let pacientes = [];
let indiceEdicao = null;

function carregarPacientes() {
    pacientes = JSON.parse(
        localStorage.getItem("pacientes") || "[]"
    );

    lista.innerHTML = "";

    if (pacientes.length === 0) {
        lista.textContent = "Nenhum paciente cadastrado.";
        return;
    }

    pacientes.forEach((paciente, indice) => {
        const item = document.createElement("div");
        const nome = document.createElement("h3");
        const telefone = document.createElement("p");
        const email = document.createElement("p");
        const botaoEditar = document.createElement("button");
        const botaoExcluir = document.createElement("button");

        nome.textContent = paciente.nome;
        telefone.textContent = "Telefone: " + paciente.telefone;
        email.textContent = "E-mail: " + paciente.email;

        botaoEditar.textContent = "Editar";
        botaoExcluir.textContent = "Excluir";

        botaoEditar.addEventListener("click", () => {
            editarPaciente(indice);
        });

        botaoExcluir.addEventListener("click", () => {
            pacientes.splice(indice, 1);

            localStorage.setItem(
                "pacientes",
                JSON.stringify(pacientes)
            );

            if (indiceEdicao === indice) {
                cancelarEdicao();
            }

            carregarPacientes();
        });

        item.append(
            nome,
            telefone,
            email,
            botaoEditar,
            botaoExcluir
        );

        lista.appendChild(item);
    });
}

function editarPaciente(indice) {
    const paciente = pacientes[indice];

    document.getElementById("nome").value = paciente.nome;
    document.getElementById("telefone").value = paciente.telefone;
    document.getElementById("email").value = paciente.email;
    document.getElementById("nascimento").value = paciente.nascimento;

    indiceEdicao = indice;

    botaoSalvar.textContent = "Salvar alterações";
    botaoCancelar.hidden = false;

    formulario.scrollIntoView({ behavior: "smooth" });
}

function cancelarEdicao() {
    indiceEdicao = null;
    formulario.reset();

    botaoSalvar.textContent = "Cadastrar paciente";
    botaoCancelar.hidden = true;
}

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const paciente = {
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        email: document.getElementById("email").value,
        nascimento: document.getElementById("nascimento").value
    };

    if (indiceEdicao === null) {
        pacientes.push(paciente);
        alert("Paciente cadastrado com sucesso!");
    } else {
        pacientes[indiceEdicao] = paciente;
        alert("Paciente atualizado com sucesso!");
    }

    localStorage.setItem(
        "pacientes",
        JSON.stringify(pacientes)
    );

    cancelarEdicao();
    carregarPacientes();
});

botaoCancelar.addEventListener("click", cancelarEdicao);

carregarPacientes();
</script>

</body>
</html>

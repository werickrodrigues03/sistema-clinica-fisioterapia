
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - FisioGestão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>FisioGestão</h1>
    <p>Gerenciamento de agendamentos</p>
</header>

<div class="container">

    <aside class="sidebar">
        <h2>Menu</h2>
        <a href="index.html">Dashboard</a>
        <a href="pacientes.html">Pacientes</a>
        <a href="fisioterapeutas.html">Fisioterapeutas</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="atendimentos.html">Atendimentos</a>
    </aside>

    <main>
        <h2 id="tituloFormulario">Novo Agendamento</h2>
        <p>Preencha os dados da sessão.</p>

        <form id="formAgendamento">

            <label>Paciente:</label>
            <select id="paciente" required>
                <option value="">Selecione um paciente</option>
            </select>

            <label>Fisioterapeuta:</label>
            <select id="fisioterapeuta" required>
                <option value="">Selecione um fisioterapeuta</option>
            </select>

            <label>Data:</label>
            <input type="date" id="data" required>

            <label>Horário:</label>
            <input type="time" id="horario" required>

            <label>Tipo de atendimento:</label>
            <input type="text" id="tipo"
                placeholder="Ex.: Fisioterapia motora" required>

            <button type="submit" id="botaoSalvar">
                Agendar sessão
            </button>

            <button type="button" id="botaoCancelar"
                style="display:none;" onclick="cancelarEdicao()">
                Cancelar edição
            </button>

        </form>

        <h2>Agendamentos cadastrados</h2>
        <div id="listaAgendamentos"></div>
    </main>
</div>

<script>
const formulario = document.getElementById("formAgendamento");
const lista = document.getElementById("listaAgendamentos");
const campoPaciente = document.getElementById("paciente");
const campoFisioterapeuta = document.getElementById("fisioterapeuta");

let agendamentos = [];
let indiceEdicao = null;

function carregarOpcoes() {
    const pacientes = JSON.parse(
        localStorage.getItem("pacientes") || "[]"
    );

    const fisioterapeutas = JSON.parse(
        localStorage.getItem("fisioterapeutas") || "[]"
    );

    pacientes.forEach((paciente, indice) => {
        const opcao = document.createElement("option");
        opcao.value = indice;
        opcao.textContent = paciente.nome;
        campoPaciente.appendChild(opcao);
    });

    fisioterapeutas.forEach((profissional, indice) => {
        const opcao = document.createElement("option");
        opcao.value = indice;
        opcao.textContent = profissional.nome;
        campoFisioterapeuta.appendChild(opcao);
    });
}

function carregarAgendamentos() {
    agendamentos = JSON.parse(
        localStorage.getItem("agendamentos") || "[]"
    );

    lista.innerHTML = "";

    if (agendamentos.length === 0) {
        lista.textContent = "Nenhum agendamento cadastrado.";
        return;
    }

    agendamentos.forEach((agendamento, indice) => {
        const item = document.createElement("div");
        const titulo = document.createElement("h3");
        const profissional = document.createElement("p");
        const data = document.createElement("p");
        const horario = document.createElement("p");
        const tipo = document.createElement("p");

        const botaoEditar = document.createElement("button");
        const botaoExcluir = document.createElement("button");

        titulo.textContent = agendamento.paciente;
        profissional.textContent =
            "Fisioterapeuta: " + agendamento.fisioterapeuta;
        data.textContent = "Data: " + agendamento.data;
        horario.textContent = "Horário: " + agendamento.horario;
        tipo.textContent = "Atendimento: " + agendamento.tipo;

        botaoEditar.textContent = "Editar";
        botaoExcluir.textContent = "Excluir";

        botaoEditar.addEventListener("click", () => {
            editarAgendamento(indice);
        });

        botaoExcluir.addEventListener("click", () => {
            if (confirm("Deseja realmente excluir este agendamento?")) {
                agendamentos.splice(indice, 1);

                localStorage.setItem(
                    "agendamentos",
                    JSON.stringify(agendamentos)
                );

                carregarAgendamentos();

                if (indiceEdicao === indice) {
                    cancelarEdicao();
                }
            }
        });

        item.append(
            titulo,
            profissional,
            data,
            horario,
            tipo,
            botaoEditar,
            botaoExcluir
        );

        lista.appendChild(item);
    });
}

function editarAgendamento(indice) {
    const agendamento = agendamentos[indice];

    campoPaciente.value = encontrarIndice(
        "pacientes", agendamento.paciente
    );

    campoFisioterapeuta.value = encontrarIndice(
        "fisioterapeutas", agendamento.fisioterapeuta
    );

    document.getElementById("data").value = agendamento.data;
    document.getElementById("horario").value = agendamento.horario;
    document.getElementById("tipo").value = agendamento.tipo;

    indiceEdicao = indice;

    document.getElementById("tituloFormulario").textContent =
        "Editar Agendamento";

    document.getElementById("botaoSalvar").textContent =
        "Salvar alterações";

    document.getElementById("botaoCancelar").style.display =
        "inline-block";

    window.scrollTo(0, 0);
}

function encontrarIndice(chave, nome) {
    const registros = JSON.parse(
        localStorage.getItem(chave) || "[]"
    );

    return registros.findIndex(registro => registro.nome === nome);
}

function cancelarEdicao() {
    indiceEdicao = null;
    formulario.reset();

    document.getElementById("tituloFormulario").textContent =
        "Novo Agendamento";

    document.getElementById("botaoSalvar").textContent =
        "Agendar sessão";

    document.getElementById("botaoCancelar").style.display =
        "none";
}

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const pacientes = JSON.parse(
        localStorage.getItem("pacientes") || "[]"
    );

    const fisioterapeutas = JSON.parse(
        localStorage.getItem("fisioterapeutas") || "[]"
    );

    const indicePaciente = Number(campoPaciente.value);
    const indiceFisioterapeuta = Number(campoFisioterapeuta.value);

    if (
        !pacientes[indicePaciente] ||
        !fisioterapeutas[indiceFisioterapeuta]
    ) {
        alert("Selecione um paciente e um fisioterapeuta válidos.");
        return;
    }

    const agendamento = {
        paciente: pacientes[indicePaciente].nome,
        fisioterapeuta: fisioterapeutas[indiceFisioterapeuta].nome,
        data: document.getElementById("data").value,
        horario: document.getElementById("horario").value,
        tipo: document.getElementById("tipo").value
    };

    if (indiceEdicao === null) {
        agendamentos.push(agendamento);
        alert("Agendamento realizado com sucesso!");
    } else {
        agendamentos[indiceEdicao] = agendamento;
        alert("Agendamento atualizado com sucesso!");
    }

    localStorage.setItem(
        "agendamentos",
        JSON.stringify(agendamentos)
    );

    cancelarEdicao();
    carregarAgendamentos();
});

carregarOpcoes();
carregarAgendamentos();
</script>

</body>
</html>
